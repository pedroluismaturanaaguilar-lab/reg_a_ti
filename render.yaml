services:
  - type: web
    name: regalo-interactivo
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: regalo-data
      mountPath: /var/data
      sizeGB: 1
